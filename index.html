<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OCC – Option Chain Calculator</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#12161d;--mut:#667085;--bd:#e2e6ee;--ce:#d92d20;--pe:#067647;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1015;--card:#161a21;--tx:#eceff4;--mut:#98a2b3;--bd:#262c37;--ce:#f97066;--pe:#47cd89;--ac:#6ea0ff}}
:root[data-theme="dark"]{--bg:#0d1015;--card:#161a21;--tx:#eceff4;--mut:#98a2b3;--bd:#262c37;--ce:#f97066;--pe:#47cd89;--ac:#6ea0ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px;max-width:560px}
.top{display:flex;justify-content:space-between;align-items:baseline}h1{font-size:21px;margin:0}
.live{font-size:11px;color:var(--mut)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pe);margin-right:4px}
input{width:100%;margin:10px 0;padding:13px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:16px;text-transform:uppercase}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;padding:6px 11px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font-size:12px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sig{margin:10px 0;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--bd)}
.sig b{font-size:17px}.sig span{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:10px 0 4px}.bar i{display:block}
.lg{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px}
.c small{color:var(--mut);display:block;font-size:11px}.c b{font-size:18px}
.ce{color:var(--ce)}.pe{color:var(--pe)}
h2{font-size:13px;color:var(--mut);margin:16px 0 6px;font-weight:600}
.wrap{overflow:auto;max-height:480px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 7px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:11px;position:sticky;top:0;background:var(--card)}tr:last-child td{border:0}
td:first-child,th:first-child{text-align:center;font-weight:700}
tr.atm td{background:rgba(37,99,235,.13)}
td.mx{font-weight:700;text-decoration:underline}
.note{color:var(--mut);font-size:11px;margin-top:14px}
</style>
</head>
<body>
<div class="top"><h1>OCC</h1><div class="live"><span class="dot"></span><span id="tm"></span></div></div>
<input id="sym" list="sl" placeholder="Stock chuno, jaise RELIANCE" value="RELIANCE" autocomplete="off">
<datalist id="sl"></datalist>
<div class="chips" id="chips"></div>

<div class="sig"><b id="sg"></b><span id="sg2"></span>
  <div class="bar"><i id="b1" style="background:var(--ce)"></i><i id="b2" style="background:var(--pe)"></i></div>
  <div class="lg"><span>CE OI</span><span>PE OI</span></div>
</div>

<div class="grid" id="cards"></div>

<h2>STRIKE WISE (75 strikes)</h2>
<div class="wrap"><table><thead><tr><th>Strike</th><th>CE OI</th><th>CE Chg</th><th>PE OI</th><th>PE Chg</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="note" id="src"></div>
<div class="note">Ye sirf jaankari ke liye hai, trading salah nahi.</div>

<script>
// Live data ke liye apne backend ka link yahan daalo.
// Jawab ka format: {spot:number, records:[{strike,ceOI,ceChg,ceVol,peOI,peChg,peVol}]}
var API_URL = "/api/chain/";
var SYMS = ["RELIANCE","TCS","HDFCBANK","INFY","ICICIBANK","SBIN","ITC","LT","AXISBANK","KOTAKBANK","BHARTIARTL","TATAMOTORS","MARUTI","SUNPHARMA","BAJFINANCE","ADANIENT","WIPRO","HCLTECH","ONGC","TATASTEEL"];
var $ = function(i){return document.getElementById(i)};
$("sl").innerHTML = SYMS.map(function(s){return '<option value="'+s+'">'}).join("");
$("chips").innerHTML = SYMS.slice(0,10).map(function(s){return '<button class="chip" data-s="'+s+'">'+s+'</button>'}).join("");
$("chips").addEventListener("click",function(e){var s=e.target.getAttribute("data-s");if(s){$("sym").value=s;render()}});

var fmt = function(n){var a=Math.abs(n),s=n<0?"-":"";return a>=1e7?s+(a/1e7).toFixed(2)+" Cr":a>=1e5?s+(a/1e5).toFixed(2)+" L":n.toLocaleString("en-IN")};
function rnd(seed){var x=seed%2147483647;if(x<=0)x+=2147483646;return function(){x=x*16807%2147483647;return (x-1)/2147483646}}
function demo(sym){
  var h=0;for(var i=0;i<sym.length;i++)h=h*31+sym.charCodeAt(i);
  var r=rnd(Math.abs(h)+Math.floor(Date.now()/60000));
  var spot=500+Math.floor(Math.abs(h)%2500),step=spot>1500?25:10,atm=Math.round(spot/step)*step,rec=[];
  for(var k=-37;k<=37;k++){var d=Math.abs(k);
    rec.push({strike:atm+k*step,
      ceOI:Math.floor((9000-d*200+r()*4000)*(k>=0?1.3:0.8))*10,ceChg:Math.floor((r()-.4)*2e4),ceVol:Math.floor(r()*9e4),
      peOI:Math.floor((9000-d*200+r()*4000)*(k<=0?1.3:0.8))*10,peChg:Math.floor((r()-.4)*2e4),peVol:Math.floor(r()*9e4)});}
  return {spot:spot,records:rec,demo:true};
}
async function getData(sym){
  if(API_URL){try{var res=await fetch(API_URL+encodeURIComponent(sym));if(!res.ok)throw 0;var j=await res.json();j.demo=false;return j}catch(e){return {error:1}}}
  return demo(sym);
}
function sum(a,k){return a.reduce(function(s,x){return s+x[k]},0)}
function maxOf(a,k){return a.reduce(function(m,x){return x[k]>m[k]?x:m})}
async function render(){
  var sym=$("sym").value.trim().toUpperCase();if(!sym)return;
  var d=await getData(sym);
  if(d.error){$("src").textContent="Data nahi aa paya. Stock ka naam check karo ya 1 minute baad dobara try karo (pehli baar 50 second lag sakte hain).";return}
  var R=d.records;
  var ceOI=sum(R,"ceOI"),peOI=sum(R,"peOI"),ceC=sum(R,"ceChg"),peC=sum(R,"peChg"),ceV=sum(R,"ceVol"),peV=sum(R,"peVol");
  var pcr=ceOI?peOI/ceOI:0,vpcr=ceV?peV/ceV:0,tot=ceOI+peOI||1;
  var mc=maxOf(R,"ceOI"),mp=maxOf(R,"peOI");

  var s=pcr>1.2?"Bullish jhukav":pcr<0.8?"Bearish jhukav":"Neutral";
  $("sg").textContent=sym+": "+s+" (PCR "+pcr.toFixed(2)+")";
  $("sg2").textContent=pcr>1.2?"PE OI zyada hai, neeche support mazboot":pcr<0.8?"CE OI zyada hai, upar resistance mazboot":"CE aur PE lagbhag barabar hain";
  $("b1").style.width=(ceOI/tot*100)+"%";$("b2").style.width=(peOI/tot*100)+"%";

  var cards=[["Total CE OI",fmt(ceOI),"ce"],["Total PE OI",fmt(peOI),"pe"],
    ["CE OI Change",fmt(ceC),"ce"],["PE OI Change",fmt(peC),"pe"],
    ["CE Volume",fmt(ceV),"ce"],["PE Volume",fmt(peV),"pe"],
    ["Resistance (max CE OI)",mc.strike,"ce"],["Support (max PE OI)",mp.strike,"pe"],
    ["PCR (OI)",pcr.toFixed(2),""],["PCR (Volume)",vpcr.toFixed(2),""]];
  $("cards").innerHTML=cards.map(function(c){return '<div class="c"><small>'+c[0]+'</small><b class="'+c[2]+'">'+c[1]+'</b></div>'}).join("");

  var atm=R.reduce(function(a,b){return Math.abs(b.strike-d.spot)<Math.abs(a.strike-d.spot)?b:a});
  $("tb").innerHTML=R.map(function(x){
    return '<tr'+(x===atm?' class="atm"':'')+'><td>'+x.strike+'</td>'
     +'<td class="ce'+(x===mc?' mx':'')+'">'+fmt(x.ceOI)+'</td><td class="ce">'+fmt(x.ceChg)+'</td>'
     +'<td class="pe'+(x===mp?' mx':'')+'">'+fmt(x.peOI)+'</td><td class="pe">'+fmt(x.peChg)+'</td></tr>'}).join("");

  var ar=document.querySelector("tr.atm");if(ar&&window._ls!==sym){var w=ar.closest(".wrap");w.scrollTop+=ar.getBoundingClientRect().top-w.getBoundingClientRect().top-w.clientHeight/2;window._ls=sym}
  document.querySelectorAll(".chip").forEach(function(c){c.classList.toggle("on",c.getAttribute("data-s")===sym)});
  $("tm").textContent="Har 1 min update | "+new Date().toLocaleTimeString("en-IN");
  $("src").textContent=d.demo?"Abhi demo data hai. Live data ke liye API_URL set karo.":"Live data";
}
$("sym").addEventListener("change",render);
render();setInterval(render,60000);
</script>
</body>
</html>
